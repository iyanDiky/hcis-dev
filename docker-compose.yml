version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hcis-db
    environment:
      POSTGRES_DB: hcis
      POSTGRES_USER: hcis_user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hcis-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: hcis-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  db_data:
